name: Fuse Energy
description: 'Fuse Energy (Fuse Energy Supply Limited) is a UK-based residential and
  business energy supplier providing gas and electricity on variable, fixed, and multi-rate
  tariffs, alongside EV charging, solar and battery export tracking, multi-property
  account management, and an in-app AI energy assistant called Plugs. The company positions
  itself around beating the UK energy price cap, sign-up in under three minutes, and
  24-hour customer support. It operates a consumer- and business-facing web and mobile
  app experience and publishes no public API, developer portal, or SDKs at this time.'
